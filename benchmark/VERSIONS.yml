  # it: `8aa6bead…` -> `8f595b83f5219c9bb696c838eb46058c308fe536201df8f4f94e541b69ba0c56`.
  #
  # THE VERSION STAYS 1.1 UNDER THIS FILE'S OWN BUMP RULE.  The four data pins
  # above are byte-untouched and no item was added to, removed from or edited
  # in either pool: what changed is how much of the release the manifest
  # COVERS, which is a schema fact, not a dataset fact.  A reader comparing a
  # D1.1 citation from before this move with one from after is comparing the
  # same items measured the same way.
  #
  # WHY THE PRE-CITATION PRECEDENT STILL APPLIES.  On 2026-08-04 the repository
  # owner ruled the `RESULTS_SLICE1_PRELIMINARY.md` D1.1 row's citation window,
  # verbatim: "Preliminary ≠ published; precedent renews verbatim."  An in-repo
  # PRELIMINARY document is not a released row, so "no released row cites D1.1"
  # still holds and this move is inside the same unpublished window as the
  # first.  No row is annotated anywhere; the first freeze point is the J5
  # publication (`RESULTS_SLICE1.md`), after which a pin a published number
  # cites is frozen and a further move requires a version, not a precedent.
  #
  # C1 adds the two already-pinned v1 mutant catalogues to the release
  # inventory without changing either catalogue or any dataset item.  Their
  # producer-byte SHA-256 values were already frozen in
  # `slice1_mutation_assets.json`; the inventory now makes the repository
