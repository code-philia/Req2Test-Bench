  py/__init__.py: harness
  py/analyze_py.py: harness
  py/prod_index.py: harness
  py/match_steps.py: harness
  py/stub_accept.py: harness
  py/compile_check.py: harness
  py/bench_environment.py: harness
  py/accessor_recorder_selftest.py: infrastructure
  # The cucumber stack's closure half, held to `closure_py` by identity.
  java/closure_java.py: harness
  java/kapua.py: harness
  java/kapua_population.py: harness
  java/kapua_gold_coverage.py: harness
  java/kapua_headroom.py: harness
  java/kapua_pilot.py: harness
  java/kapua_census_mutation.py: harness
  java/kapua_reference.py: harness
  java/kapua_development_release.py: harness
  # The cucumber stack's direct-invocation collector: the agent jar's build,
