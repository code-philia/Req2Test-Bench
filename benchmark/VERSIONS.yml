  #
  # 1.1 -> 1.2 IS ONE DISCLOSED RELEASED-BYTES MIGRATION (2026-08-12).
  # The 422 CoreShop items, their membership and their closure contents do not
  # change.  Their gold sidecars are re-emitted with canonical repo-relative
