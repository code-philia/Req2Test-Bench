# Envelope-equivalence ledger: rulings of record that bind an ADDITIONAL
# scored manifest digest to an already-registered population.  A row here is
# not a second population and never edits the historical entry above -- it
# states, naming both fingerprints and the exact difference, that one
# preserved population acquired a second envelope digest when its
# boundary-config bytes were renamed.  The disclosure pattern follows the B4
# release-approval join (ALGORAND_BUNDLE_V1_SPEC.md section 12): name both
# digests, name the one-line divergence, refuse anything else.  Validation
# lives in `r2t/data/versions.py` (`_validate_envelope_equivalences`); the byte
# cross-checks are in `versions.selftest`.
#
# The 2026-09-01 owner ruling ("extend the equivalence ledger and make
# consumers resolve it") settles what a row is FOR.  A registered
# `asset_index` is not re-pinned to whatever the tree carries today: it is
# what the historical evidence was collected under, and rewriting it would
# retroactively restate a collection.  The row says instead that two index
# digests name one population, and the readers resolve it --
# `reference_controls._role_check` and `gold_killset._population_claim` admit
# a campaign stamped with either digest through
# `versions.equivalent_asset_indexes`, and still refuse anything else by
# name.  Without that, a python-docx sweep collects perfectly and is then
# unreadable, which is the defect the ruling answers.
population_envelope_equivalences:
  schema: r2t.population-envelope-equivalence/1
  rows:
    - population_id: coreshop-v1
      ruling: >-
        2026-08-19 interactive owner ruling, disposition row LB7
        (EVAL100_STD_WRAPPER_COMPLETION_SPEC.md section 10): the preserved
        CoreShop eval100-std evidence's mutation population is registered
        under both envelope digests as ONE population -- same population,
        renamed envelope ("register equivalence").
      difference: >-
        benchmark/config/boundary_coreshop.yml changed exactly one line in
        commit 53d5f9f (2026-08-12, portability): `repo_root:` moved from
        /data2/binhang/coreshop_bench/app to projects/coreshop/source,
        moving the file's sha256 from 752efb18... to 73c2cb67....  The raw
        catalogue (03f4017d..., n=10463), the 258 non-production exclusions,
        the scored n=10205 and the 49168 map pairs are identical under both
