  # `boundary.config` IS THE BARE FILENAME, AND `boundary.sha256` IS RECORDED
  # RATHER THAN REHASHED.  The bare spelling is what the index says and the
  # registry may only restate its index; respelling it would change the index
  # digest, and that digest is not free -- the preserved v18 campaign
  # identities recorded `asset_index_sha256` 79007e9d..., so a respelled
  # index would strand every one of them at `gold_killset` and
  # `hard_subset`'s registry comparison.  What that leaves unenforced is
  # worth saying exactly, because it is an asymmetry with the two Slice 1
  # entries.  `boundary.sha256` here is release provenance: what
  # `config/boundary_algorand.yml` hashed to when this catalogue was minted
  # and validated.  Since 2026-09-17 the tree's file no longer hashes to it:
  # it gained two retained entries for the harness-owned step-tag listener
  # (TARGET_INTERFACES_V2_SPEC.md section 4a), so this digest is the
  # mint-time identity and is re-declared by re-validation at the v2 tag.
  # Nothing in this tree recomputes it.  The drift begins with commit
  # 01e16479 of 2026-09-16, and as MEASURED on 2026-09-16 at tag
  # `checked-interfaces-v2` the tree's file hashes to
  # 5f800a46a71db5c53e1a7ff87385dd21a55abe469b40b8be7e05ca6b897d22c1.  That
  # value is NOT written into `boundary.sha256` below, because this dict may
  # only restate the frozen index (`versions.selftest` compares them field by
  # field) and the index's digest is `asset_index_sha256` 79007e9d..., which
  # the preserved v18 campaign identities depend on.  Moving the pin is the
  # re-mint this comment's last paragraph says needs a ruling; naming the
  # current bytes here needs none.  `versions.selftest` pins this entry's whole boundary dict
  # to the frozen index and rehashes the index FILE, so the number cannot
  # drift from the index -- but it never opens the boundary file, and the one
  # `sha256_file` of a boundary in `versions.py` belongs to the
  # envelope-equivalence loop, whose only row is coreshop-v1.  The coreshop
  # and python-docx boundaries ARE rehashed, by `validate_asset_pins` through
  # `mutation_assets.files` above, and this one cannot join them:
  # `versions.selftest` asserts those four pins are exactly the Slice 1
  # index's pins, and pointing the same script at this index
  # (`--index config/mutation_assets_algorand_v18.json`) refuses outright,
  # because `asset_pin_expectations` resolves the bare basename against the
  # repository root.  So an edit to `config/boundary_algorand.yml` leaves the
  # deterministic checks green here where it would redden them for the other
  # two projects.  Where it IS caught is
  # `mutation_attestation.validate_index_binding`, which compares
  # `sha256_file(boundary_path)` against this digest -- an operator gate at
  # re-mint or re-validation, not a pull-request check.
  #
  # ITS FIRST POPULATION IS GENERATION 2, NOT GENERATION 1.  The number is an
  # operator-catalogue label, not a per-project counter: `report`'s macro
