  # what the de-saturation control asserts, i.e. which items are hard.
  toolkit/strip_java.py: harness
  # The behave twin of `stub.py`.  Harness, because the stub is the FLOOR the
  # anti-vacuity gate is measured against: a stub that stopped running its
  # item's steps would lower that floor without any candidate changing.
  # `py/stub_accept.py` moves with it (see the note on `mutation_py.py`).
  toolkit/stub_py.py: harness
  # The cucumber twin of the two above, for the same reason and with two
  # rules of its own: it keys on the step TEXT (cucumber matches whatever
  # keyword registered a definition) and it must declare the trailing
  # parameter a DocString/DataTable step supplies, because Java has no
  # optional parameters and a wrong arity ERRORS instead of vacuously
  # passing -- which would shrink the population the <= 0.02 bound is
  # measured over rather than lower the floor honestly.
  toolkit/stub_java.py: harness
