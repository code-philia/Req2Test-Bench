# Assertion-hard population artifacts.  C4 lands the checked registry and
# refuses an absent pin; C5 fills it only after the four independent native
# observations exist.  A pin binds both serialized bytes and the artifact's
# canonical self-digest, so reformatting and semantic mutation are distinct
# detectable changes.
hard_subset_artifacts:
  schema: r2t.hard-subset-registry/1
  pins: {}

# ---------------------------------------------------------------------------
# OWNERSHIP -- WHICH COMPONENT'S VERSION A MODULE'S CHANGE WOULD BUMP.
#
# THIS TABLE IS DOCUMENTATION.  Bump discipline is human and review-enforced;
# a selftest cannot classify a semantic change.  Nothing here is machine-
# checkable except completeness: `versions.selftest` asserts that every
# `r2t/**/*.py` on disk appears below (keys are package-relative paths, so
# `agents/base.py` and `stacks/base.py` are two rows), so a new module cannot
# be silently unowned, and that is the whole extent of the automation.  The
# five-way component partition (core/data/bench/toolkit/agent) is a different
# question -- WHICH CHECKOUT a file belongs to, not what a change to it bumps
# -- and lives in `r2t/core/components.py`.  A one-line edit to
# `validate.py` that changes a verdict needs a harness bump; a hundred-line
# refactor of the same file that cannot change a verdict needs none, and no
# rule written here can tell a reviewer which one they are looking at.
#
# Ambiguous modules take human judgment at bump time.  `adapters.py` is the
# clearest case -- its prompt text is a protocol artifact and its process
# handling is an adapter artifact, living in one file -- and it is written
# below as the compound it is rather than being forced into one column.
# ---------------------------------------------------------------------------

ownership:
  # Docker client routing is harness-owned: it decides which already-
  # provisioned executor a command reaches, while worker-runtime/v2 records
  # that selection separately from verdict logic and immutable image identity.
  core/docker_cli.py: harness
  docker_authority.py: harness

  # -- harness: execution, judging, and the measurements read off a run ------
  bench/harness.py: harness
  bench/validate.py: harness
  # The round-trip sweep over K workers.  Harness, and specifically the same
  # component as `validate.py`, because the one thing it decides is which
  # recorded verdicts a resume may TRUST: rows carry `HARNESS_VERSION` and a
  # sweep resumed across a bump re-runs rather than inherits.  It computes no
  # verdict itself.
  toolkit/sweep.py: harness
  bench/runner.py: harness
  bench/campaign.py: harness
  # The read side of the Slice-3 coordinator: the frozen views, the
  # six-observation gate, the execution binding and the bound-observation
  # reader.  Harness, for `slice3_eval.py`'s reason: its outputs decide the
  # measured item/mutant views.
  bench/slice3_evidence.py: harness
  # The Slice-3 test-quality join (SLICE3_TEST_QUALITY_SPEC.md §2): the
  # Docker-free scorer for the two published algorand-sdk cells and the §2.5
  # sidecar acceptance path.  Harness, like `test_quality.py` and
  # `slice3_eval.py` whose join it is: a semantic change here changes which
  # verdicts a published number is allowed to trust.
  bench/slice3_test_quality.py: harness
  bench/population.py: harness
  bench/results.py: harness
  bench/report.py: harness
  bench/metrics.py: harness
  # The offline selector of the harness-25 corrections: it predicts, with the
  # harness's own rules, which recorded rows those rules change.
  bench/evaluator_corrections.py: harness
  # Whether a row is a FIRST observation of its item or a re-draw of one, and
  # why the prior attempt was discarded.  Harness, and a HARNESS_VERSION bump
  # if the reason vocabulary or the stamp's shape ever changes: rows written
  # under two different vocabularies would be two different claims wearing one
  # field name, and the whole point of the field is that a reader can tell a
  # rule-4 infrastructure re-run from a candidate's second draw.  Adding a
  # reason is that kind of change; adding a citation to an existing stamp is
  # not.
  bench/draws.py: harness
  # RETAINED for legacy validation only: recorded egress attestations and
  # sealed agent evidence keep validating byte-identically through these two.
  # The prospective gates that used to invoke them are retired.
  egress.py: harness
  # Content-addressed strict-egress evidence binds the detector's gate
  # version and rules digest, the candidate run, the complete inspected
  # trajectory inventory and the result; the detector and scanner source
  # bytes are recorded provenance, and drift from the verifying tree is
  # disclosed.  A semantic change can admit or refuse release evidence, so it
  # has the same harness owner as the detector whose result it seals.
  bench/egress_attestation.py: harness
  bench/trajectory_validation.py: harness
  bench/repo.py: harness
  bench/prestashop_resources.py: harness
  bench/prestashop_memory.py: harness
  bench/worker.py: harness
  bench/prestashop_selftest.py: harness
  bench/dbadmin.py: harness
  toolkit/quality.py: harness
  bench/test_quality.py: harness
  # Shared prospective mutation-quality admission and orchestration.  It
  # decides which evidence may enter the existing test-quality verdict path,
  # so semantic changes move with the harness.
  bench/live_test_quality.py: harness
  toolkit/anti_vacuity.py: harness
  # Portable source authentication for anti_vacuity.py: archived controls,
  # native N=2 rows/sidecars, observation plans, and release inventory pins.
  # It changes what evidence a hard-recall verdict is allowed to trust, so it
  # moves with the harness rather than with release documentation.
  toolkit/anti_vacuity_evidence.py: harness
  # Reviewed DOCX population execution binding. It changes no population or
  # metric; it authenticates the exact v1/v2 build command before that one
  # existing producer may reach Docker, so it is infrastructure-owned.
  toolkit/docx_v2_workload.py: infrastructure
  # Pilot startup recovery authenticates preserved evidence and invokes the
  # original tagged producer. It changes no row, metric, or execution engine.
  bench/mutation_startup_recovery.py: infrastructure
  data/mutation.py: harness
  # Feasibility-only deterministic batching plans.  Harness-owned because the
  # exact scalar pair set, member weights and ordinary-source compatibility
  # are execution evidence.  The enablement registry is deliberately empty:
  # this module cannot execute or stamp a batch policy, so landing it alone
  # changes no verdict and does not bump the harness version.
  bench/mutation_batch.py: harness
  # Content-addressed mutation populations, maps, archived evidence and the
  # apply/parse/restore release gate.  These determine which mutants and
  # historical pairs a harness may score, so their validator moves with the
  # harness rather than documentation.
  data/mutation_attestation.py: harness
  # The writer half of mutation_attestation.py (wave M5): the audit that
  # decides whether a population may be scored, so harness for the same reason.
  toolkit/mutation_audit.py: harness
  # The one writer that MINTS an `r2t.mutation-assets/1` entry: it decides
  # which population, map, boundary, oracle and audit a project's index
  # names, so it owns the same question `mutation_attestation.py` validates
  # and moves with the harness for the same reason.
  toolkit/mutation_asset_index.py: harness
  toolkit/coreshop_mutation_map_selftest.py: infrastructure
  toolkit/coreshop_mutation_authority_selftest.py: infrastructure
  bench/mutation_run.py: harness
  bench/mutation_continuation.py: harness
  bench/prestashop_continuation.py: harness
  bench/prestashop_continuation_selftest.py: harness
  bench/prestashop_continuation_packet.py: harness
  bench/mutation_distribution.py: harness
  # Read-only bounded reporting over a compute-capped native test-quality
  # campaign. It changes no complete-campaign verdict and mints no point
  # estimate, but it authenticates the same execution evidence and applies a
  # recall method, so harness is the conservative owner.
  bench/mutation_bounds.py: harness
  # The conservative N=2 gold oracle: it binds two complete native campaigns
  # to one registered population and freezes their failed-only intersection.
  toolkit/gold_killset.py: harness
  # Candidate-blind de-saturation: full-gold failed N=2 intersected with a
  # stripped-gold passed N=2 witness.  This artifact defines the headline
  # denominator and therefore moves with the harness.
  toolkit/hard_subset.py: harness
  # Prospective single-observation reference controls: authenticates the
  # three complete full-population roles, applies section 5.1's uniform
  # exclusion, and derives the reusable G/H basis.  It decides which evidence
  # and which denominator candidate scoring may consume, so semantic changes
