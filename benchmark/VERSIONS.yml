  stacks/__init__.py: harness
  stacks/base.py: harness
  stacks/behat.py: harness
  stacks/behave.py: harness
  stacks/cucumber.py: harness
  stacks/godog.py: harness
  stacks/cucumber_ruby.py: harness
  ruby/__init__.py: harness
  ruby/e_petitions.py: harness
  toolkit/rbstep_index.py: harness
  toolkit/closure_rb.py: harness
  toolkit/stub_rb.py: harness
  toolkit/strip_rb.py: harness
  toolkit/mutation_rb.py: harness
  toolkit/prod_index_rb.py: harness
  toolkit/interfaces_rb.py: harness
  # The behave stack's programs: the static index, matching and stub
  # acceptance by behave's own registry, the compile gate and the recorder
  # installed as `features/environment.py`.  Harness, like `closure_py.py`
