  core/__init__.py: infrastructure
  # The `data` package's own `__init__.py`: the same.  Its members are filed
  # dataset, harness, protocol and infrastructure; the marker decides none.
  data/__init__.py: infrastructure
  # The one-line re-export of data/mutation.py under its pre-M5 name, kept
  # for the frozen enumerator py/mutate.py; it bumps what that file bumps.
  mutation.py: harness
  # The `toolkit` package's own `__init__.py`: the same.
  toolkit/__init__.py: infrastructure
  # The `bench` package's own `__init__.py`: the same.  Its MEMBERS are filed
  # six different ways -- harness, dataset, adapter, protocol,
  # protocol+adapter, infrastructure -- and the package marker itself decides
  # none of them.
  bench/__init__.py: infrastructure
  # Subset sampling decides which items a published number is measured on --
  # dataset work wearing an infrastructure file name, the same trap the
  # comment above flags for release.py.  A change to its ALGORITHM_VERSION is
  # a dataset-provenance event even though no item byte changes.
  data/step_definition_census.py: dataset
  data/sylius_selection.py: dataset
  java/kapua_census.py: dataset
  data/subsets.py: dataset
  ruby/evaluation_selection.py: dataset
  # Its two writers (wave M5): the bytes a draw leaves on disk, same owner.
  toolkit/subset_writer.py: dataset

# Where one file's version is not the whole story.  Read at bump time.
ownership_notes:
  adapters.py: "the prompt functions were protocol (a reworded instruction is
    a different task) and are data/prompt.py since wave M5; the agent process
    handling that shared this file until wave O2 is adapter (a changed budget
    is a different system) and is agents/adapter.py now.  The LLM config, the
    single-shot openai adapter and the C3 trial budget stayed: decide which
    half you touched before deciding what to bump."
  profile.py: "the prompt half is protocol; the boundary/config half is harness
    configuration.  Assigned to protocol because that is the half a reader is
    comparing across systems."
  release.py: "the released dataset's vocabulary and readers; since wave M5
    toolkit/release_build.py is the infrastructure that WRITES the dataset
    artifacts.  A change to which items ship is a dataset change even though
    neither file is one."
