  # The five-way component table and its import-direction checks, and the
  # spellings two components share.  Infrastructure like this manifest: a
  # re-filed module bumps nothing; a changed constant is a change to the
  # module that USES it and bumps whatever that module bumps.
  core/components.py: infrastructure
  core/constants.py: infrastructure
  # The image definitions read as source.  Infrastructure for the same reason
  # `smoke.py` is: it measures nothing and judges no row -- it refuses a
  # Dockerfile that contradicts the harness about the offline repository
  # path, the JDK major or the allowlisted base.  The judgment this line
  # makes explicit is that the DOCKERFILE is not covered by it: an executor
  # image is identified in evidence by its own recorded id and base digest,
  # which is a stronger pin than a component version, and rebuilding one is
  # an owner act with its own gate rather than a version bump.
  toolkit/images.py: infrastructure
