      before any run cited it (`network_policy.enforced_by`; digest
      5b65bf1365b08baa -> 09d5fc7d2fd6a3ec), and the file says so at the top.
      v3 supersedes it the day after, and by ADDING a file rather than editing
      one: max_iterations 30 -> 100 (v2 pinned the harness default, the
      published arm ran at 100) and native_knobs.aider for the second
      scaffold.  v2 is cited by no row on disk, so superseding it strands
      nothing; its digest stays pinned above because the immutability promise
      is about the file, not about which file is current.  v4 is the ONE
      exception to reading this list as a ladder: it is v3's python-docx twin,
      byte-identical in all seven knobs and both native budgets (asserted by
      `protocol.selftest`, since that identity is what lets a docx cell and a
      CoreShop cell claim one recipe), differing only in `protocol_version`
      and `prompt_profile`.  Two digests for one recipe is the intended
      outcome: the prompt identity is PART of the recipe, so P3 and P4 tell a
      reader which project's frozen prompts a row was generated from -- which
      a single file carrying a per-project map could not have done.  v5 and
      v6 are the EPUBCheck and Algorand Slice-3 twins: c3, unlimited trials,
      one draw, coverage, the 3600-second envelope, and a closed
      deepseek-v4-flash request with thinking enabled, reasoning_effort high,
      and temperature/top_p omitted.  v7 and v8 are v5's and v6's twins under
      the owner's 2026-08-12 ruling: every knob identical, the closed request
      instead naming deepseek-v4-pro with thinking DISABLED and
      reasoning_effort present-and-null.  They are new FILES rather than edits
      because that is what this list promises, and v5/v6 stay pinned and
      loadable -- the q-freeze artifacts that cite them remain readable, and
      no row was ever generated under either.  The measured reason for the
      ruling is in RESULTS_EVAL100.md: this endpoint serves deepseek-v4-pro in
      thinking mode by default, and a subset of its upstreams then demands a
      `reasoning_content` passback the SDK does not send, which killed 44
      multi-turn conversations on the eval100 night.  v9 and v10 are the
      network-policy-free CoreShop and python-docx successors to v3 and v4.
      v11 copies v9 and changes only `protocol_version` and the per-item agent
      timeout (3,600 -> 1,200 seconds) for the owner-approved post-hoc CoreShop
      sensitivity analysis; v9 remains the preregistered primary policy.  v12
      is Algorand's generic six-cell twin of v9/v10: the parsed recipe differs
      only in `protocol_version` and Algorand's frozen `prompt_profile`, and it
      carries neither Slice-3's closed model request nor a network policy."

