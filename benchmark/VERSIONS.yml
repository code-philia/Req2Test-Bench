  toolkit/mutation_go.py: infrastructure
  toolkit/mutation_go_selftest.py: infrastructure
  toolkit/mutation_py.py: harness
  py/mutate.py: harness
  # The Java v2-from-birth producer binding.  It owns the disjoint engine id,
  # complete-envelope/manifest seam and compiled applier entry point, so a
  # semantic change moves with the harness just like mutation_py.py.  Its
  # `java/Mutate.java` producer bytes are independently pinned above; no Java
  # population or released cucumber mutation capability is implied here.
  toolkit/mutation_java.py: harness
  toolkit/closure.py: harness
  # The stack seam and its three implementations: what a run is executed
  # against, dispatched from the profile's `framework:`.  A change to the
  # record schema, the step vocabulary or a stack's execution half changes
