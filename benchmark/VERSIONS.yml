  # What a system is told, what it is allowed to see, and under which budgets.
  #
  # Frozen BY CONTENT like the dataset, and for a stronger reason: a protocol
  # file is IMMUTABLE.  A changed knob is a NEW protocol_vN.yml, never an edit,
  # because archived rows cite the old one's digest and an edit would leave
  # them asserting a recipe that no longer exists.  So the sha256s below are
  # not a bump discipline, they are a tripwire -- if one moves, somebody
  # edited history, and `versions.selftest` says so.
  #
  # `version: 5` is the CURRENT CoreShop protocol, i.e. the recipe a new sweep
  # should be launched under.  Earlier files remain shipped and readable;
  # they are simply not what anything new should run.  SUPERSEDING IS NOT
  # EDITING: their bytes and digests below are unchanged, because a protocol
  # file is immutable whether or not it is current.
  #
  # TWELVE FILES, WITH PROJECT-SPECIFIC TWINS AND SUCCESSORS.  v4 is v3's TWIN:
  # identical knobs, python-docx's frozen prompt digests instead of CoreShop's,
  # because a protocol copies ONE project's prompt identity and a docx sweep
  # citing P3 would name digests it never sent.  So "the current protocol" is
  # per PROJECT from here on, and the mapping is derived from the files rather
  # than restated here (`protocol.protocol_for_project`: coreshop -> [3, 9, 11, 13],
  # python-docx -> [4, 10, 14], epubcheck -> [5, 7], algorand-sdk -> [6, 8, 12]).
  # `version:` stays 3 because it answers "which recipe is current" for the
  # project this benchmark started with, and bumping it
