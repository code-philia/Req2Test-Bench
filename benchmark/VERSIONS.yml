  bench/reference_pair_continuation.py: harness
  bench/reference_pair_continuation_selftest.py: infrastructure
  bench/evaluation_reference.py: harness
  bench/evaluation_reference_selftest.py: infrastructure
  # The behave stack's mutation engine, wired to the manifest above.  Same
  # component as `mutation.py` and for the sharper reason: it supplies the
