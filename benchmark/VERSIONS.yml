  # validation report pinned.  Four things about this entry are not obvious.
  #
  # ITS FROZEN INDEX SITS UNDER `config/`, NOT `release/`.  Every nonsymlink
  # file below `release/` is digested by `release/dataset_manifest.json`,
  # which `dataset.files` above pins; putting the index there would move that
