  # The executor and the judge.  This number is stamped onto every run row and
  # into every campaign fingerprint, so it is the field that decides whether
  # two archived sweeps may be compared at all.
  harness:
    # 12 -> 18 ON THE mutation-evaluation-collection-v1.1 LINE, which is NOT
    # master's 18 below: that line (cut from
    # c51836e1, H12) restores generated production classes -- the seed's
    # `var/classes` members -- to their seed bytes before every pair.  Under
    # H12 a class re-saved by a retained step while a CoreShop CoreExtension
    # mutant was applied stayed on disk after the revert, and every later
    # pair on that worker died on autoload as `solution_error` (16,788
