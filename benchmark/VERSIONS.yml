    # a published verdict, so it is exactly the bump_rule's case.
    # 5 -> 6: the Scenario Outline fold (every Examples row must pass, and the
    # fold reaches validate._thin), 2026-08-02.  Identity on single-record
    # runs -- the archived CoreShop sweeps re-render byte-for-byte -- but a
    # verdict on an outline corpus CAN differ, which is what the rule bumps on.
    #
    # 6 STAYS 6 THROUGH PR R3 (campaign lifecycle and identity v2,
    # 2026-08-05), and the judgment is recorded here because R3 touches four
    # harness-owned modules (campaign, mutation_run, test_quality, worker's
    # callers) and changes what may merge or resume.  The rule is "bump IFF a
    # change could alter a verdict", and both directions were applied:
    #
    #   * COULD a verdict differ?  No.  R3 edits no judging code -- validate,
    #     harness, metrics and the outcome vocabulary are untouched -- and it
    #     re-executes nothing.  What it changes is which evidence may be
    #     COMBINED (v1/v2 and cross-attempt merges refuse), which shard writes
    #     are legal, and what an identity records.  Every archived v1 campaign
    #     sidecar still re-hashes to the digest it was published under, which
    #     is the same identity-on-single-record standard 5 -> 6 was recorded
    #     against (`campaign.selftest`, over `artifacts/runs/*.campaign.json`).
    #
    #   * WOULD A BUMP BE HARMLESS?  No, which is why the "only if" half
    #     matters.  This number is stamped on every row and is what a resume
    #     keys on (`validate.py:198`, `sweep`): bumping it tells every
    #     in-flight sweep that its harness-6 rows were produced by an executor
    #     that could judge differently, and it would re-run them.  That claim
    #     would be false, and Cell 1 was still executing when R3 landed.
    #
    # The identity change is versioned WHERE IT HAPPENS instead, and at finer
    # grain than an integer could give: `r2t.generation-campaign/v2` and
    # `r2t.mutation-campaign/v2` are explicit schema strings that never merge
    # across versions, and the v2 fingerprint carries `harness_commit` and
    # `harness_source_sha256` -- which say exactly which harness BYTES judged
    # a run, a question no component number has ever been able to answer.
