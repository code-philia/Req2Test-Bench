# The binding artifact manifest.  Read by `r2t/data/versions.py`.
#
# WHY this file exists.
#
# "The benchmark" is not one artifact, it is five that move at different
# speeds: the DATASET (which items exist), the HARNESS (how a submission is
# executed and judged), the EGRESS GATE (what counts as a contaminated run),
# the ADAPTERS (how a particular agent is driven), and the PROTOCOL (what a
# system is told and allowed to see).  A single "benchmark v2" number would
# hide the only question a reader ever has about two results printed side by
# side: are these two numbers comparable, and if not, which of the five
# changed underneath them?
#
# So each component carries its own version, and each version names the
# AUTHORITY that defines it -- the constant in the code, or the bytes of the
# files.  The manifest is documentation of a promise, and `r2t/data/versions.py`
# turns the parts of that promise a machine can check into selftest checks:
# the harness version here must equal `validate.HARNESS_VERSION`, and the
# dataset digests here must be the sha256 of the files actually on disk.  A
# manifest nothing cross-checks is a comment, and comments drift.
#
# Gate 5 is live prospective configuration. The gate-4 fields remain here as
# historical provenance for the published eval100 standard arm. The protocol
# remains cross-checked against the sha256 of its files AND the document
# digests `r2t/bench/protocol_file.py` pins.

components:

  # Frozen BY CONTENT, not by a number: the version string is a label for
  # humans, and the sha256s are what actually pin the data.  If a line of
  # `eval100.jsonl` is edited, no bump is required for the check below to go
  # red -- which is the point.  Bumping `version` without changing the digests
  # (or the reverse) is the operator error this shape makes visible.
  #
  # 1.0 -> 1.1 IS ADDITIVE, AND THE TWO v1 DIGESTS BELOW PROVE IT.  A second
  # project (python-docx: 239 criterion items over 32 distinct closures) ships
  # in `release/python-docx/`, beside CoreShop's pool rather than merged into
  # it, and the first two lines of `files:` are byte-for-byte what 1.0 pinned.
  # MINOR because nothing a published number was measured on has changed: no
  # item was added to, removed from or edited in `items_v1.jsonl`, and
  # `eval100.jsonl` is the same 100 ids it always was.  A reader comparing a
  # D1.0 citation with a D1.1 one is comparing the same CoreShop data.
  #
  # `dataset_manifest.json` is pinned here and pins the rest.  Under schema
  # `r2t.dataset_manifest/3` it carries the sha256 of EVERY nonsymlink regular
  # file below `release/` (itself excepted, to avoid a self-digest), the
  # retained identities of each project's bundle-only gold sidecars, and each
  # subset with its sidecar.  So
  # this list stays two lines per project — the pool and its published subset —
  # and the manifest is the third line that makes every other released file
  # unforgeable.  `scripts/build_dataset_manifest.py --check` rebuilds it and
  # refuses if a byte moved; from PR R1 onward that check runs in CI.
  # Schema /3 additionally declares one versioned scoring-bundle asset per
  # project and the logical data-root paths it installs. This changes delivery
  # metadata, not either released item population, so dataset version 1.2 is
  # unchanged. The frozen mutation index records both completed audits.
  # python-docx declares v1.0.0-rc.5 (2026-09-06): the seed re-cut with the
  # harness-11 recorder that records `direct_calls`. The archive built from
  # branch commit 83cb24b measured sha256 a28acd89... twice, but it predates
  # the `production_index` role this declaration now carries: the rebuild
  # passes `--production-index release/python-docx/py_prod_index.json` and
  # will therefore hash to something else. THAT PATH IS NOW HISTORY, not the
  # instruction: dataset 1.6 re-pinned the role to the schema-2 (API
  # Amendment 2) index the bundle ships (428daa19..., installed at
  # `projects/python-docx/artifacts/py_prod_index.json`), so the re-cut
  # passes those bytes -- the committed file is schema 1 (be6c93e2...) and
  # `toolkit/bundle_build.py` refuses a `--production-index` whose SHA-256 is
  # not the manifest's pin. rc.5 is amended in place rather
  # than re-cut because its asset digest is still `null` and no published
  # number cites it. That `null` stands until the asset is
  # rebuilt at a reviewed tag, uploaded and re-hashed, the same fail-closed
  # window CoreShop's rc.5 went through. Every legacy-report evidence role is
  # still the rc.4 byte; the bundled profile is the current file, which
  # drifted from rc.4's copy in comments and in `api_scoring`, now
  # `method_index` (the four prompt digests are over rendered prompts and are
  # unchanged).
  # CoreShop declares v1.0.0-rc.6 (2026-09-07): fresh pinned clone and
  # re-strip with the merged PHP direct-call recorder. Only the recorder and
  # retained-services header change workspace content; frozen SQL, runtime
  # dependencies and historical evidence (including the std arm) retain the
  # rc.5 bytes. The development proof is under r2t_coreshop_rc6_dev_20260907.
  # The asset digest stays null until the reviewed-tag build, upload and
  # re-download publication gate. Dataset version 1.2 is unchanged.
  #
  # THE MANIFEST PIN MOVED ONCE WITHIN 1.1, BEFORE ANY ROW CITED IT.  The
  # final pre-campaign review found `anti_vacuity.json` claiming its gold
  # recall could catch a flaky re-execution (it cannot: the kill set is
  # defined by the same sweep it is scored against), so the CLAIM was
  # rewritten and the document regenerated from the SAME sweep files — every
  # measured counter is byte-identical, the four data pins above are
  # untouched, and dataset 1.1 was minted in the same unpublished session,
  # with no released row citing D1.1 yet.  A pin a published number cites is
  # frozen; this one was not yet citable.
  #
  # AND IT MOVED A SECOND TIME WITHIN 1.1, ON THE SAME PRECEDENT (PR R1,
  # 2026-08-04).  The adversarial review of the Slice 1 implementation found
  # the manifest describing a release it no longer matched (a hand CR-strip of
  # `python-docx/exclusions.csv`), the 661 gold sidecars carrying no content
  # digest at all, nine released files pinned by nothing, and python-docx's
  # census published under CoreShop.  R1 restores the producer's CSV bytes,
