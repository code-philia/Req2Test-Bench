    # both.  That merge is `18 -> 19` below, and this entry stays because a
    # withdrawn number still has to be readable: CoreShop rows stamped 18
    # came from THAT line's tree, never from master's 18.
    # 11 -> 12: approved API Amendment 2 unions complete Examples records
