  bench/reference_controls.py: harness
  bench/reference_workloads.py: harness
  bench/prestashop_reference.py: harness
  bench/prestashop_reference_selftest.py: infrastructure
  toolkit/assertion_selection.py: harness
  # The from-disk half of that artifact: it derives the three adapter
