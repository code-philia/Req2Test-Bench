facts:
- Step definitions are public methods on plain Java classes, annotated with `io.cucumber.java.en.Given`,
  `@When`, `@Then`, `@And` or `@But`. The Given/When/Then keyword is irrelevant to matching. Put unit-domain
  definitions in `com.algorand.algosdk.unit`; the retained runner also scans `com.algorand.algosdk.cucumber.shared`.
- Patterns are Cucumber Expressions. `{string}`, `{int}`, `{long}` and `{word}` are built in; a pattern
  that starts and ends with `/` is treated as a regular expression.
- The scenario's `Background` steps run before it and need definitions too.
- Shared state is constructor-injected by cucumber-picocontainer. Declare a public constructor taking
  another glue class when steps must share an object; instances are scoped to one scenario.
- '`RunCucumberUnitTest.java` and the helper classes under `unit/utils/` are retained. Do not redeclare
  the runner. `ClientMocker` and `TestingUtils` may be imported from `com.algorand.algosdk.unit.utils`.'
- Assertions use AssertJ (`import static org.assertj.core.api.Assertions.assertThat;`) or JUnit. Let assertion
  failures propagate so Cucumber records the step as failed.
- The SDK under test is `src/main/java/com/algorand/algosdk/**`. Production code and composed `.feature`
  files are never accepted as an answer.
- Scenario fixtures remain under `src/test/resources/`, including the generated response directories,
  `programs/`, `stateproof/`, the v2 client response directories and the two multisig transaction files.
  Use the paths named by the scenario text.
- In the separate execution repository, the build is Maven in a JDK 11 runtime and compiles the project
  at its pinned Java 8 release level. Its test classpath contains Cucumber-JVM 6.6.0, cucumber-picocontainer,
  JUnit and AssertJ; pom.xml is production and changes to it are discarded.
- This workspace supports reading, searching, editing, and syntax parsing. It is not a provisioned application
  runtime; nothing here is executed by the harness. The harness executes your final submitted test artifacts
  against a separate, complete implementation after generation ends. You receive no harness execution
  feedback during generation.
- TARGET_CONTRACTS.md contains the reviewed public API and configuration supplement supplied in every
  visibility view. It is context for writing tests; edits to it are not submitted.
- 'Implementation visibility: all inventoried subject-production bodies and executable initializers are
  hidden; declarations, reviewed contract supplements and retained test infrastructure remain visible.'
