# coddy-agent ships no v1 visibility trio, so this is its level-one
# profile_coddy_agent.yml plus exactly the delta every other project's
# trio applies: the three visibility facts, final-only trial clauses,
# the disclosure and the visibility block. The level-one profile is
# not edited.
