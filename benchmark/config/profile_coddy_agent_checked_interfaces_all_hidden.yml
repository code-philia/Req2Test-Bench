facts:
- The project uses Go 1.25.0 and github.com/cucumber/godog v0.15.1. Return complete Go files at every path named by the item. Define the primary glue in
  the package and top-level Test function named by the item. Package placement matters because glue
  may use unexported production names and retained package-local helpers.
- Register steps through godog.ScenarioContext.Step, Given, When or Then inside the suite ScenarioInitializer.
  Matching uses Godog's registry. Capture arguments follow the function signature; multiline tables and
  docstrings arrive as *godog.Table and *godog.DocString.
- 'The item supplies two independent selections: explicit Go build tags (empty, http or cli) and the original
  effective Godog tag expression. Preserve the required package/build directive. The harness freezes the
  selected suite''s feature path, Godog filter, TestingT and serial execution options immediately before
  Run.'
- Use one godog.TestSuite.Run call in the named test function. Named or inline initializers, captured
  testing.T, wrapper setup and cleanup remain part of the glue. A missing or malformed suite is an installation
  or compilation failure. No other parent top-level test or suite is selected; do not call t.Parallel.
- The scenario Background needs step definitions too. A selected Scenario Outline runs all its permitted
  Examples rows serially in one fresh process. Compilation and execution share the existing 600-second
  item budget; runtime module downloads and external network access are unavailable, while loopback fixtures
  can run.
- All 61 bdd_*_test.go files are removed across their original packages. The 112 named sibling non-BDD
  test helpers are retained; the other 83 ordinary test files remain readable too. These files contain
  worked production-API examples. Ordinary test functions compile as support but are excluded by the exact
  test selector.
- The subject is itself a coding agent and heavily agent-developed. Its reference glue may have been written
  by language models, which may make the task appear easier; the retained helper examples are also disclosed
  inputs.
- No Node/npm or UI build is available. The upstream HTTP and CLI build tags remain separate. The attachment-encoding
  suite keeps its original Linux ~@windows filter. These choices preserve the declared item population;
  the item specifies the selected configuration.
- Put answer helpers within the exact accepted Go file set. The harness adds execution support only in its
  private compilation copy. Production files, retained support, original features, go.mod and go.sum are
  protected inputs.
- This workspace supports reading, searching, editing, and syntax parsing. It is not a provisioned application runtime; nothing here is executed by the harness. The harness executes your final submitted test artifacts against a separate, complete implementation after generation ends. You receive no harness execution feedback during generation.
- TARGET_CONTRACTS.md contains the reviewed public API and configuration supplement supplied in every visibility view. It is context for writing tests; edits to it are not submitted.
- 'Implementation visibility: all subject-project production implementation bodies are hidden. Public declarations, reviewed contract supplements, and retained test infrastructure remain visible.'
