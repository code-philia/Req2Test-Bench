api_scoring: method_index
boundary: boundary_coreshop.yml
conditions:
  project_source_noun: CoreShop source
  retained_substrate: the retained `CoreShop\Bundle\TestBundle`
disclosure:
  checked_interfaces: true
facts:
- 'Step definitions live in classes that implement `Behat\Behat\Context\Context` and declare their patterns
  in DOCBLOCK annotations: `/** @Given /^regex$/ */`, `@When`, `@Then`. Plain-text patterns (`@Given I
  am logged in as :email`) also work. The Given/When/Then keyword is irrelevant to matching.'
- Argument transforms use `/** @Transform /^regex$/ */` methods on a context class and convert a captured
  string into an object.
- The scenario's `Background` steps run before it and need definitions too.
- <wiring-channel>
- '`CoreShop\Bundle\TestBundle\Service\SharedStorageInterface` is the shared clipboard between steps (`->set($key,
  $value)`, `->get($key)`).'
- Assertions are made with `Webmozart\Assert\Assert`.
- 'Production namespaces are `CoreShop\Component\*` and `CoreShop\Bundle\*`. Put your classes under `src/CoreShop/Behat/Context/Domain/**`,
  creating missing directories. Custom hook classes may use that directory too. `src/CoreShop/Behat/Context/Hook/`
  is retained infrastructure: files created or changed anywhere in that subtree are not submitted.'
- This workspace supports reading, searching, editing, and syntax parsing. It is a provisioned application runtime for the code in `./repo`; nothing here is executed by the harness. The harness executes your final submitted test artifacts
  against a separate, complete implementation after generation ends. You receive no harness execution
  feedback during generation.
- TARGET_CONTRACTS.md contains the reviewed public API and configuration supplement supplied in every
  visibility view. It is context for writing tests; edits to it are not submitted.
- 'Implementation visibility: the reviewed target bodies, including behavior-bearing delegated helpers,
  are hidden; declarations and permitted surrounding implementations remain visible.'
