facts:
- Cucumber loads Ruby step definitions from features/step_definitions/. Use Given, When or Then with a
  regular expression or Cucumber Expression and a Ruby block. The keyword does not distinguish definitions
  when matching a step.
- Captured expression parameters become block arguments. A step DocString or DataTable adds its native
  multiline argument after the captures. Background steps execute before the scenario and need definitions
  too.
- Per-scenario state is held on Cucumber World, including Ruby instance variables. Retained features/support/
  files provide the Rails and Capybara setup, lifecycle hooks, route paths, selectors, sections and World
  helpers. Do not replace those files.
- Use the retained RSpec expectations and Capybara rack_test integration to exercise the Rails application.
  Production code under app/ and lib/ is never accepted as a submission.
- The retained spec/factories.rb supplies FactoryBot factories; spec/support/ supplies shared support.
  Scenario fixtures and recorded VCR responses remain under spec/fixtures/. The constituency API is stubbed
  by retained hooks.
- The admitted scenario set excludes inherited or scenario-level @wip and @javascript tags. Eligible scenarios
  run in process with rack_test; no browser or external network is available.
- The image provides Ruby 3.2.11, Cucumber 11.1.1, bundled gems, Node dependencies and a private PostgreSQL
  16 database with pgvector. Retained hooks rebuild assets at boot. Do not install dependencies or change
  database configuration.
- Put Ruby files under features/step_definitions/**, creating the directory if needed. The entire original
  directory was removed, including helpers and generated web_steps.rb, email_steps.rb and pickle_steps.rb
  boilerplate. Some boilerplate may be reproducible from public gem documentation; the retained env.rb
  is also generated cucumber-rails support.
platform_blurb: the UK Parliament e-petitions Rails application (Ruby 3.2.11, Cucumber 11.1.1, PostgreSQL
  16 with pgvector)
conditions:
