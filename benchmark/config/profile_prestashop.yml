# PrestaShop task profile, frozen before the first affected collection.
# Boundary authority: sprint D15; upstream census is checked by
# scripts/gate_s2_boundary_prestashop.py. Scenario remains the execution unit.
# Population exclusions were approved at Track R H0 on 2026-09-09.
# This declares the intended runtime contract. Collection requires the shared
# per-suite Behat integration and PrestaShop registration, preserving original
# suite paths, tag filters, retained contexts and context order.
# A changed rendered prompt after collection requires a new profile.
version: 1
project: prestashop
project_label: PrestaShop
language: php
language_label: PHP
framework: behat
api_scoring: method_index
runtime:
  needs_database: true
boundary: boundary_prestashop.yml

task:
  artefact_noun: step-definition code
  gherkin_suffix: .feature
  removed_noun: Behat test code

submission:
  acceptance_root: tests/Integration/Behaviour/Features/Context/
  example_path: tests/Integration/Behaviour/Features/Context/Domain/XFeatureContext.php
  example_code: '<?php ...'
  placement_hint: tests/Integration/Behaviour/Features/Context/...
  suffixes:
    - .php
  extra_names: []
  retained_note: |-
    `CommonFeatureContext.php`, `ContextFeatureContext.php`, `OrderMessageContext.php`, `AbstractPrestaShopFeatureContext.php`, `Domain/AbstractDomainFeatureContext.php`, the abstract product and combination helpers, `SharedStorage.php`, `SharedStorageTrait.php`, `LastExceptionTrait.php`, `CartAwareTrait.php`, `Configuration/`, `Util/`, `tests/Integration/Behaviour/Features/Transform/`, `tests/Integration/Behaviour/bootstrap.php`, `tests/Integration/Utility/` and `tests/Resources/` remain

# Upstream Behat registers FQCNs directly, not Symfony context services.
wiring_channel: null
workspace:
  repo_dir: repo
  readable_paths:
    - src
    - classes
    - controllers
    - app
    - config
    - tests/Integration/Behaviour
    - tests/Integration/Utility
    - tests/Resources
    - composer.json

# Judge census quote, preserved as a quote rather than an updated count:
# "1,651 scenarios
# 57 Behat suites, all in-process and headless
# 54 scenario directories under Features/Scenario
# 169 PHP files under Features/Context"
# The pinned-tree census measures 55 immediate scenario directories, not 54.
# Judge pitfall quote: "The 11 @todo and ~10 @example scenarios should be excluded from scoring."
# Correction: these are raw-text hits in comments (todo) and email addresses
# (example); there are zero actual todo/example tags in any Gherkin tag block.
facts:
  - |-
    Step definitions live in classes that implement `Behat\Behat\Context\Context` and declare their patterns in DOCBLOCK annotations: `/** @Given /^regex$/ */`, `@When`, `@Then`. Plain-text patterns (`@Given I am logged in as :email`) also work. The Given/When/Then keyword is irrelevant to matching.
  - |-
    The scenario's `Background` steps run before it and need definitions too. Each benchmark item executes one scenario with its Background; earlier scenarios are not setup.
  - |-
    Context classes use the `Tests\Integration\Behaviour\Features\Context` namespace and its subnamespaces. Composer maps `Tests\` to `tests/`. Behat registers context class names directly in each suite. CommonFeatureContext is the shared fixed context. Each item requires the retained context list of its original upstream suite, in the original order, alongside submitted context classes. That list is selected from the original Behat configuration, independently of the reference closure. The other suites' retained transforms and hooks are not globally registered. No Symfony service definition file is part of the submission.
  - |-
    Extend retained `AbstractPrestaShopFeatureContext` for `getSharedStorage()` and reference helpers, or `Domain\AbstractDomainFeatureContext` for `getCommandBus()`, `getQueryBus()` and exception helpers. Shared storage uses `set($key, $value)`, `get($key)` and `exists($key)`. Production code lives under `src/`, `classes/` and `controllers/`, including Symfony services, CQRS handlers and legacy classes.
  - |-
    ALL 57 are in-process and headless. There is no browser suite to exclude, and no @javascript tag exists anywhere in the corpus.
  - |-
    tests/UI (Playwright) and tests/Unit + tests/Integration PHPUnit are NOT part of behat.yml and are out of scope by construction.
  - |-
    Scoring excludes every scenario selected by the upstream employee suite and every scenario carrying an actual @todo or @example Gherkin tag, including inherited tags. At the pinned commit the employee suite contains seven scenarios and neither excluded tag occurs in a Gherkin tag block. Comments and email addresses are not tags. Population exclusions are preserved by item identity and reason in the release exclusions histogram.
  - |-
    PHP >= 8.1 (CI matrix runs several 8.x) with ext mbstring, intl, gd, xml, dom, json, fileinfo, curl, zip, iconv. MySQL 8.0 REQUIRED (MariaDB variant also in CI) — the shop is really installed into it.
  - |-
    CommonFeatureContext retains its four step definitions and all 24 hook annotations. Configuration contexts retain another 14 step annotations because their directory is outside the approved removable set. Top-level OrderMessageContext retains one because its name is outside the approved *FeatureContext.php pattern. The retained files contain 19 step annotations in total. Only the original suite's retained contexts are registered for an item, and its matched retained steps are measured; a scenario passing without removable glue is excluded by validation.
  - |-
    tests/Integration/Behaviour/bootstrap.php; CommonFeatureContext.php (it holds only 4 step defs but ALL the @BeforeSuite kernel boot, @BeforeFeature/@AfterScenario DatabaseDump restore hooks, cache clearing and ContextMocker); AbstractPrestaShopFeatureContext.php and AbstractDomainFeatureContext.php (0 step defs each — pure helpers: referenceToId, getCommandBus, getQueryBus); SharedStorage.php + SharedStorageTrait.php + LastExceptionTrait.php + CartAwareTrait.php; Features/Context/Util/**; Features/Transform/** (the @Transform table converters); and all of tests/Resources/** (DatabaseDump, ResourceResetter, MailDevClient, test modules/themes).
  - |-
    Cross-scenario state inside a feature file — SharedStorage persists across scenarios, so customer_group_management.feature's 'Update the created customer group' presupposes the preceding 'Create' scenario ran. Per-scenario isolation will fail unless you run whole feature files as the unit, or synthesise the prior scenarios as setup. This is the single biggest harness decision.
  - |-
    The benchmark keeps the scenario execution unit. Per-scenario fail-then-pass validation excludes order-dependent scenarios by refusal, and the release reports that exclusions histogram. It neither runs whole feature files as one item nor synthesises earlier scenarios as setup.
  - |-
    `--strict --no-snippets` is the upstream invocation; keep --strict so undefined/pending steps fail rather than silently pass — this is also your vacuous-pass guard.

platform_blurb: |-
  the PrestaShop e-commerce platform (PHP, Symfony, CQRS and legacy classes, MySQL 8.0)
conditions:
  retained_substrate: |-
    the retained PrestaShop Behat hooks, configuration contexts, abstract helpers, transforms and test resources
  project_source_noun: PrestaShop source

trial:
  client_interpreter: python3
  runner_noun: Behat
  clause_bounded: |-
    You can run the scenario: `{interpreter} {client}` executes whatever is in your workspace now and prints {runner}'s per-step results and error messages. You may do this {k} times.
  clause_unbounded: |-
    You can run the scenario: `{interpreter} {client}` executes whatever is in your workspace now and prints {runner}'s per-step results and error messages. You may do this as often as you want.

