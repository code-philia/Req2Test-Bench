disclosure:
  checked_interfaces: true
facts:
- Step definitions are plain functions decorated with `@given`, `@when` or `@then`, imported from `behave`
  (`from behave import given, when, then`). behave loads every module under `features/steps/`; the Given/When/Then
  keyword is irrelevant to matching.
- Step parameters are captured by the default `parse` matcher with `{name}` or `{name:Type}` placeholders
  (`@then('the paragraph has {count:d} runs')`). For regular expressions call `use_step_matcher('re')`
  first, and switch back with `use_step_matcher('parse')` -- the setting applies to every step defined
  after it.
- To convert a captured string into an object, register a type with `behave.register_type(Bool=parse_bool)`
  and name it in the placeholder (`{value:Bool}`). There is no separate transform decorator.
- The scenario's `Background` steps run before it and need definitions too.
- '`features/environment.py` holds the lifecycle hooks (`before_all`, `before_feature`, `before_scenario`,
  and their `after_` counterparts). It is retained: do not write one.'
- The `context` object passed to every step is the shared state between steps of a scenario (`context.document
  = document`, then read `context.document` in a later step). behave resets it per scenario; anything
  that must outlive a scenario belongs on `context.config` or in the environment hooks.
- Assertions are plain `assert` statements. behave reports the AssertionError as the step failure, so
  include a message (`assert len(paragraphs) == 3, "got %d" % len(paragraphs)`).
- In the execution repository, the library under test is imported as `docx` and lives in `src/docx/`;
  `src` is already on the import path, so `from docx import Document` works without installing anything.
  Production code is never accepted.
- The `.docx`, `.jpg`, `.png`, `.bmp`, `.gif`, `.tif`, `.emf` and `.wmf` fixtures a scenario opens are
  still on disk in `features/steps/test_files/`, and their names are the ones the scenario text uses.
  The helper module that used to turn a name into a path went with the removed code; write whatever helper
  you need, or build the path directly.
- A scenario that SAVES a document writes into `features/_scratch/`, which the retained environment hook
  creates before the run. Nothing else in the tree may be written.
- This workspace supports reading, searching, editing, and syntax parsing. It is not a provisioned application
  runtime; nothing here is executed by the harness. The harness executes your final submitted test artifacts
  against a separate, complete implementation after generation ends. You receive no harness execution
  feedback during generation.
- TARGET_CONTRACTS.md contains the reviewed public API and configuration supplement supplied in every
  visibility view. It is context for writing tests; edits to it are not submitted.
- 'Implementation visibility: the reviewed target bodies, including behavior-bearing delegated helpers,
  are hidden; declarations and permitted surrounding implementations remain visible.'
