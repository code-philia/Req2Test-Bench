api_scoring: method_index
boundary: boundary_sylius.yml
conditions:
  project_source_noun: Sylius source
  retained_substrate: the retained Sylius Behat substrate (Setup, Transform and Hook contexts, the API
    client and shared storage)
disclosure:
  checked_interfaces: true
facts:
- 'Step definitions are PHP 8 attributes on public context methods: `#[Given(''/^regex$/'')]`, `#[When(...)]`,
  `#[Then(''plain text with :placeholder'')]`. Both plain-text and `/^regex$/` patterns are used, and
  a single method may carry several attributes.'
- '`#[Transform(...)]` methods on Transform contexts convert a captured string into an object, typically
  by repository lookup.'
- The scenario's `Background` steps run first; most are answered by the retained Setup contexts, but a
  few are answered only by the Api contexts you are writing.
- <wiring-channel>
- Requests are issued through the retained `Sylius\Behat\Client\ApiClientInterface` (`ApiPlatformClient`,
  wired over Symfony's `test.client`, in-process) together with `RequestFactoryInterface` and `ResponseCheckerInterface`.
  The shared clipboard between steps is `Sylius\Behat\Service\SharedStorageInterface` (`->set($key, $value)`,
  `->get($key)`).
- Assertions are made with `Webmozart\Assert\Assert`.
- 'Suites are tag-filtered and a scenario is reachable only through its suite: alongside the classes you
  return, the harness registers the retained Setup, Transform and Hook contexts of the API suite whose
  tag filter matches the scenario''s feature tag plus `@api`.'
- Production namespaces are `Sylius\Component\*` and `Sylius\Bundle\*`. Put your classes under `src/Sylius/Behat/Context/Api/**`.
  Removal took that directory with the code, so it does NOT exist yet -- create the path you need.
- This workspace supports reading, searching, editing, and syntax parsing. It is not a provisioned application
  runtime; nothing here is executed by the harness. The harness executes your final submitted test artifacts
  against a separate, complete implementation after generation ends. You receive no harness execution
  feedback during generation.
- TARGET_CONTRACTS.md contains the reviewed public API and configuration supplement supplied in every
  visibility view. It is context for writing tests; edits to it are not submitted.
- 'Implementation visibility: all subject-project production implementation bodies are hidden. Public
  declarations, reviewed contract supplements, and retained test infrastructure remain visible.'
