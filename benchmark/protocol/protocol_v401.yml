notes:
  specification: specifications/EXECUTION_ENABLED_TH_SENSITIVITY_SPEC.md defines the execution-enabled
    target-hidden condition c2r, a labelled sensitivity. Its rows carry condition c2r, are paired item by item
    with the rows of the blind twin protocol_v94.yml and are never pooled with c2 rows, in a table or in any
    mean. This file fixes the recipe of one c2r cell only; it authorizes no collection.
  admission: Codex development arm under CODEX_AGENT_ADMISSION_SPEC.md. Existing publication and qualification
    gates remain unchanged.
  execution_channel: The workspace is a provisioned runtime of the agent's own target-hidden view through the
    python-docx runtime pack (specification section 3), so the agent's own commands and tests run on its own
    files in its own sandbox. No harness trial client, socket, callback or evaluation results are available
    during generation.
  runtime_pack: The launch binds the python-docx runtime pack whose manifest digest is runtime_pack
    manifest_sha256 and refuses an installed pack with any other, so the cell cannot mix pack versions and a
    rebuilt pack needs a new protocol (specification section 6).
  request_budget: max_model_calls counts upstream provider request attempts including retries, not native
    turns or tool calls. Request 201 is never forwarded.
  model_input: The native Responses request names deepseek-flash with high reasoning effort, omits
    temperature and top_p, and has web search and provider-hosted tools disabled. Codex protocols 33-44
    keep deepseek-v4-flash.
  comparability: protocol_v94.yml, the codex@2 census recipe of this model, project and setting, is this
    file's blind twin, and this file differs from it only in protocol_version, condition, prompt_profile,
    runtime_pack and notes. Its prompt profile is the twin's with the visibility fact's runtime sentence
    replaced (specification section 4.1), and its arm prompt is that profile's c2r prompt. How rows under
    the two files are compared is the specification's decision (section 8), not this file's.
  evaluation_runtime_inputs: Final evaluation uses the existing --timeout 600, --repeats 1 and --coverage
    policy. The 600-second evaluator timeout is an explicit run argument, not a field applied by the current
    protocol runtime.
visibility:
  scope: target_hidden
  feedback: final_only
model_request:
  schema: r2t.protocol-model-request/1
  model: deepseek-flash
  wire_api: responses
  reasoning_effort: high
  omitted_parameters:
