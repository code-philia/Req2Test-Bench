# Immutable execution-enabled target-hidden recipe v404; specifications/EXECUTION_ENABLED_TH_SENSITIVITY_SPEC.md.
# deepseek-flash, Sylius, `setting: checked_interfaces_target_hidden`, condition c2r: final-only
# generation in a workspace that can run the agent's own target-hidden view through the sylius runtime pack.
# The blind twin is protocol_v100.yml, the codex@2 census recipe of this model, project and setting. Every field
# but protocol_version, condition, prompt_profile (the variant profile, its five digests and arm key c2r),
# runtime_pack and notes is the twin's.
# IMMUTABLE after its digests are pinned.
