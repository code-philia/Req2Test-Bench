  project: prestashop
  arm_prompt_key: c2r
  prompt_digest:
    single_shot: 8630c886a3b69619b4236db48b90f92f6c889acec2be66e68dac2755f2aa90f0
    c1.5: 6c362f8c502b6793b1a6f8a93769663f395e41fb299b9c0521880bd2e4a8079e
    c2: 27c92132d037d511b3edf6681b6b9292ed1ab61b3a62fbf48aeea605bc3f0052
    c3: 466f055dd59985a5a11896301beeeea2e4928bf0a9ad2fe2618feaea07d0f75d
