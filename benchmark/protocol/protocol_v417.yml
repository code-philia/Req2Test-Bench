# Immutable benchmark 2.0 re-run baseline recipe v417; specifications/BENCHMARK_V2_SPEC.md section 5.4.
# deepseek-flash, Algorand SDK, `setting: checked_interfaces_target_hidden`, condition c2r, on the project's 2.0
# target-hidden views and its fixed 2.0 runtime pack (a working `which` and the Maven repository at `~/.m2`).
# The c2r twin is protocol_v403.yml, whose blind twin is protocol_v98.yml. Every field but
# protocol_version, runtime_pack and notes is protocol_v403.yml's.
# IMMUTABLE after its digests are pinned.
