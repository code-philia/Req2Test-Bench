notes:
  specification: specifications/BENCHMARK_V2_SPEC.md section 5.4 makes this file the Eclipse Kapua baseline cell of
    benchmark 2.0, re-run on the project's 2.0 target-hidden views and its fixed runtime pack (question 7, answer
    A). specifications/EXECUTION_ENABLED_TH_SENSITIVITY_SPEC.md (the specification below) defines its condition c2r.
    Rows under this file are 2.0 rows and are never pooled with rows of another protocol, in a table or in any mean.
    The c2r cell of protocol_v405.yml stays a c2r record. This file fixes the recipe of one cell only; it authorizes
    no collection.
  admission: Codex development arm under CODEX_AGENT_ADMISSION_SPEC.md. Existing publication and qualification
    gates remain unchanged.
  execution_channel: The workspace is a provisioned runtime of the agent's own target-hidden view through the
    kapua runtime pack (specification section 3), so the agent's own commands and tests run on its own files in
    its own sandbox. No harness trial client, socket, callback or evaluation results are available during
    generation.
  runtime_pack: The launch binds the kapua runtime pack whose manifest digest is runtime_pack manifest_sha256 and
    refuses an installed pack with any other, so the cell cannot mix pack versions and a rebuilt pack needs a new
    protocol (specification section 6). This is benchmark 2.0's rebuilt pack (BENCHMARK_V2_SPEC.md section 8.2,
    docs/artifacts/benchmark-2.0/kapua-algorand-sdk-pack-rebuild.md), the pack of protocol_v405.yml with a working
    `which` in rt/bin, the Maven repository at ~/.m2, runner v5 and a build script that names no host path.
  request_budget: max_model_calls counts upstream provider request attempts including retries, not native
    turns or tool calls. Request 201 is never forwarded.
  model_input: The native Responses request names deepseek-flash with high reasoning effort, omits
    temperature and top_p, and has web search and provider-hosted tools disabled. Codex protocols 33-44
    keep deepseek-v4-flash.
  comparability: protocol_v405.yml, the c2r recipe of this model, project and setting, is this file's twin, and this
    file differs from it only in protocol_version, runtime_pack and notes. Its blind twin is protocol_v102.yml. The
    2.0 views equal the c2r views with the pack's repairs applied (BENCHMARK_V2_SPEC.md section 5.1), so the pack is
    the one input that changed. How rows under this file are compared with other 2.0 arms is BENCHMARK_V2_SPEC.md's
    decision (section 9, PR 6), not this file's.
  evaluation_runtime_inputs: Final evaluation uses the existing --timeout 600, --repeats 1 and --coverage policy.
    The 600-second evaluator timeout is an explicit run argument, not a field applied by the current protocol runtime.
visibility:
  scope: target_hidden
  feedback: final_only
model_request:
  schema: r2t.protocol-model-request/1
  model: deepseek-flash
  wire_api: responses
  reasoning_effort: high
  omitted_parameters:
  - temperature
  - top_p
