  path: config/profile_kapua_checked_interfaces_target_hidden_exec.yml
  project: kapua
  arm_prompt_key: c2r
  prompt_digest:
    single_shot: c993365d6d3ce54ca2e8ff421c192148d1cf9d687015e16b212c1fece2516bef
    c1.5: bf5b39831d3c7139c89eea6cd03d76a97bdf7970fcc50046db1c92397a8ba2f9
    c2: f1806d47e2cf1d9774925eae56a9a3647e1efb1c817a1853da08ab8855c5e5e0
    c3: 3cf1fc2899cdbc83e849b0f67c7ae4fa9a3fe7ec38e692a7a87c1c3424e582f1
    c2r: 1e8bde6792c11b9d6f9acd2b9757d7f6448500e7f31f3bea010cff8eb8834d57
