# Immutable benchmark 2.0 recipe v423; specifications/BENCHMARK_V2_SPEC.md section 9 (PR 6) and
# specifications/FRONTIER_ARMS_20261015_AMENDMENT.md.
# gpt-6.1-sol, Eclipse Kapua, `setting: checked_interfaces_target_hidden`, condition c2r,
# on the project's 2.0 target-hidden views and its 2.0 runtime pack.
# The baseline twin is protocol_v418.yml, the deepseek-flash cell of benchmark 2.0. Every field but
# protocol_version, model_request.model and notes is the twin's.
# IMMUTABLE after its digests are pinned.
schema: r2t.protocol/1
