# Immutable benchmark 2.0 recipe v424; specifications/BENCHMARK_V2_SPEC.md section 9 (PR 6) and
# specifications/FRONTIER_ARMS_20261015_AMENDMENT.md.
# gpt-6.1-sol, coddy-agent, `setting: checked_interfaces_target_hidden`, condition c2r,
# on the project's 2.0 target-hidden views and its 2.0 runtime pack.
# The baseline twin is protocol_v406.yml, the deepseek-flash cell of benchmark 2.0. Every field but
# protocol_version, model_request.model, runtime_pack (the scrubbed pack) and notes is the twin's.
# IMMUTABLE after its digests are pinned.
schema: r2t.protocol/1
protocol_version: 424
reconstructed: false
condition: c2r
trials: 0
agent_timeout_seconds: 3600
primary_budget: agent_timeout_seconds
native_knobs:
  codex:
    max_model_calls: 200
repeats: 1
coverage: true
setting: checked_interfaces_target_hidden
comparison_class: fixed_model_scaffold
