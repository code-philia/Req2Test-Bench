  path: config/profile_coddy_agent_checked_interfaces_target_hidden_exec.yml
  project: coddy-agent
  arm_prompt_key: c2r
  prompt_digest:
    single_shot: 3f05c21b0a8ff63e214cb839fb4d2f6b0003433d76517dd6aabf30c1937bfc19
    c1.5: 8dbe39c3a20b2ceb402b44f6e67e52c45ca7e5b9ca38e1d2f4f7fc352197ec98
    c2: 7c22d6f6ae342439c866296d9d1b71ca034d5d828e5660f07b7b1040d8ed8dfa
    c3: 8f5bcda382f60a694e4d1a4f563aafa2b5a455221d1a40a0154e00d3b7091127
    c2r: ec18ab24a4af70b330ec2535e7cdfc2e7e97302248b9fa8d5a875e35ba11080b
runtime_pack:
  project: coddy-agent
  manifest_sha256: f9856bbccdab5aded55551ad34ede383982594d30fb8e698210f5b67ee2223e3
notes:
  specification: specifications/BENCHMARK_V2_SPEC.md section 9 (PR 6) adds Codex x GPT-6.1 Sol as the first new arm
    of benchmark 2.0 (question 6), under specifications/FRONTIER_ARMS_20261015_AMENDMENT.md with the changes that
    section lists. specifications/EXECUTION_ENABLED_TH_SENSITIVITY_SPEC.md (the specification below) defines the
    condition c2r. Rows under this file are 2.0 rows and are never pooled with rows of another protocol, in a table
    or in any mean. This file fixes the recipe of one cell only; it authorizes no collection.
  admission: Codex development arm under CODEX_AGENT_ADMISSION_SPEC.md. Existing publication and qualification
    gates remain unchanged.
  execution_channel: The workspace is a provisioned runtime of the agent's own target-hidden view through the
    coddy-agent runtime pack (specification section 3), so the agent's own commands and tests run on its own files
    in its own sandbox. No harness trial client, socket, callback or evaluation results are available during
    generation.
  runtime_pack: The launch binds the coddy-agent runtime pack whose manifest digest is runtime_pack manifest_sha256
    and refuses an installed pack with any other, so the cell cannot mix pack versions and a rebuilt pack needs a
    new protocol (specification section 6). This is benchmark 2.0's released pack, scrubbed of host paths
    (BENCHMARK_V2_SPEC.md section 4.1, question 4, answer B). Its manifest differs from protocol_v406.yml's only by
    that scrub (section 5.1, point 2).
  request_budget: max_model_calls counts upstream provider request attempts including retries, not native
    turns or tool calls. Request 201 is never forwarded.
  model_input: The native Responses request names gpt-6.1-sol with high reasoning effort, omits temperature and
    top_p, and has web search and provider-hosted tools disabled. The baseline twin protocol_v406.yml keeps
    deepseek-flash. gpt-6.1-sol runs on its pinned native Codex release (docs/CODEX_RUNTIME.md) through a ChatGPT
    account (FRONTIER_ARMS_20261015_AMENDMENT.md section 4).
  comparability: protocol_v406.yml, the deepseek-flash baseline cell of benchmark 2.0 for this project and setting,
    is this file's twin, and this file differs from it only in protocol_version, model_request.model, runtime_pack
    and notes. Its runtime pack differs from the twin's only by the scrub of BENCHMARK_V2_SPEC.md question 4 (answer
    B). How rows under the two files are compared is BENCHMARK_V2_SPEC.md's decision (section 9, PR 6), not this
    file's.
  evaluation_runtime_inputs: Final evaluation uses the existing --timeout 600, --repeats 1 and --coverage policy.
    The 600-second evaluator timeout is an explicit run argument, not a field applied by the current protocol runtime.
visibility:
  scope: target_hidden
  feedback: final_only
model_request:
  schema: r2t.protocol-model-request/1
  model: gpt-6.1-sol
  wire_api: responses
  reasoning_effort: high
  omitted_parameters:
  - temperature
  - top_p
